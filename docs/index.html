<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monte Carlo Engine</title>
    <style>
      :root {
        --bg: #0b1018;
        --panel: #121a26;
        --panel-2: #172232;
        --ink: #edf3fb;
        --muted: #9aa9ba;
        --line: #263447;
        --blue: #67a5ff;
        --teal: #38d6c8;
        --orange: #f4a261;
        --red: #ff6b6b;
        --violet: #b894ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(18, 26, 38, 0.96);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 18px 24px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .links {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      a {
        color: var(--blue);
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 24px 36px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        overflow-x: auto;
      }

      .tab-button,
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 8px 12px;
      }

      .tab-button[aria-selected="true"],
      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #07101d;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 340px) 1fr;
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0e1520;
        color: var(--ink);
        font: inherit;
        padding: 7px 9px;
      }

      .control-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        min-height: 78px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 19px;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .chart-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      }

      .chart-title {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
      }

      canvas {
        display: block;
        width: 100%;
        height: 320px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px 6px;
        text-align: right;
        font-size: 13px;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      .matrix {
        margin-top: 12px;
      }

      footer {
        color: var(--muted);
        font-size: 12px;
        margin-top: 18px;
      }

      @media (max-width: 920px) {
        .layout,
        .chart-grid,
        .metrics {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1>Monte Carlo Quantitative Risk & Derivatives Engine</h1>
        <nav class="links" aria-label="Project links">
          <a href="https://github.com/neil-314/Monte-Carlo-Engine">GitHub</a>
          <a href="https://github.com/neil-314/Monte-Carlo-Engine#readme">README</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="tabs" role="tablist" aria-label="Simulator sections">
        <button class="tab-button" role="tab" aria-selected="true" data-tab="stock">Stock Simulation</button>
        <button class="tab-button" role="tab" aria-selected="false" data-tab="options">Option Pricing</button>
        <button class="tab-button" role="tab" aria-selected="false" data-tab="portfolio">Portfolio Risk</button>
      </div>

      <section id="stock" class="view active" role="tabpanel">
        <div class="layout">
          <aside class="panel">
            <h2>Stock Inputs</h2>
            <div class="controls">
              <label>Starting Price<input id="stock-s0" type="number" value="100" min="1" step="1"></label>
              <div class="control-row">
                <label>Expected Return<input id="stock-mu" type="number" value="8" step="0.5"></label>
                <label>Volatility<input id="stock-sigma" type="number" value="20" min="0" step="0.5"></label>
              </div>
              <div class="control-row">
                <label>Years<input id="stock-years" type="number" value="1" min="0.1" step="0.1"></label>
                <label>Steps<input id="stock-steps" type="number" value="252" min="10" step="1"></label>
              </div>
              <div class="control-row">
                <label>Simulations<input id="stock-sims" type="number" value="10000" min="100" max="50000" step="100"></label>
                <label>Target Price<input id="stock-target" type="number" value="120" min="1" step="1"></label>
              </div>
              <button class="primary" id="run-stock">Run Simulation</button>
            </div>
          </aside>
          <section>
            <div class="metrics" id="stock-metrics"></div>
            <div class="chart-grid">
              <div class="chart-panel">
                <p class="chart-title">Sample Price Paths</p>
                <canvas id="stock-paths" width="720" height="320"></canvas>
              </div>
              <div class="chart-panel">
                <p class="chart-title">Terminal Price Distribution</p>
                <canvas id="stock-hist" width="720" height="320"></canvas>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section id="options" class="view" role="tabpanel">
        <div class="layout">
          <aside class="panel">
            <h2>Option Inputs</h2>
            <div class="controls">
              <div class="control-row">
                <label>Stock Price<input id="option-s0" type="number" value="100" min="1" step="1"></label>
                <label>Strike<input id="option-k" type="number" value="105" min="1" step="1"></label>
              </div>
              <div class="control-row">
                <label>Years<input id="option-years" type="number" value="1" min="0.1" step="0.1"></label>
                <label>Risk-Free Rate<input id="option-r" type="number" value="4" step="0.25"></label>
              </div>
              <div class="control-row">
                <label>Volatility<input id="option-sigma" type="number" value="20" min="0" step="0.5"></label>
                <label>Simulations<input id="option-sims" type="number" value="100000" min="100" max="200000" step="1000"></label>
              </div>
              <button class="primary" id="run-options">Price Options</button>
            </div>
          </aside>
          <section>
            <div class="metrics" id="option-metrics"></div>
            <div class="chart-panel">
              <p class="chart-title">Call Price Convergence</p>
              <canvas id="option-convergence" width="960" height="360"></canvas>
            </div>
          </section>
        </div>
      </section>

      <section id="portfolio" class="view" role="tabpanel">
        <div class="layout">
          <aside class="panel">
            <h2>Portfolio Inputs</h2>
            <div class="controls">
              <label>Initial Value<input id="portfolio-value" type="number" value="100000" min="1000" step="1000"></label>
              <label>Simulations<input id="portfolio-sims" type="number" value="100000" min="100" max="200000" step="1000"></label>
              <button class="primary" id="run-portfolio">Run Portfolio</button>
            </div>
            <div class="matrix">
