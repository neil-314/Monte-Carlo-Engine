<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monte Carlo Engine</title>
    <style>
      :root {
        --bg: #0b1018;
        --panel: #121a26;
        --panel-2: #172232;
        --ink: #edf3fb;
        --muted: #9aa9ba;
        --line: #263447;
        --blue: #67a5ff;
        --teal: #38d6c8;
        --orange: #f4a261;
        --red: #ff6b6b;
        --violet: #b894ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(18, 26, 38, 0.96);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 18px 24px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .links {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      a {
        color: var(--blue);
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 24px 36px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        overflow-x: auto;
      }

      .tab-button,
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 8px 12px;
      }

      .tab-button[aria-selected="true"],
      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #07101d;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 340px) 1fr;
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0e1520;
        color: var(--ink);
        font: inherit;
        padding: 7px 9px;
      }

      .control-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        min-height: 78px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 19px;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .chart-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      }

      .chart-title {
        margin: 0 0 10px;
